<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero section - GSAP</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page" id="page1">
      <div class="background-elements">
        <div class="floating-shape shape1"></div>
        <div class="floating-shape shape2"></div>
        <div class="floating-shape shape3"></div>
        <div class="floating-shape shape4"></div>
        <div class="floating-shape shape5"></div>
        <div class="floating-shape shape6"></div>
      </div>
      <section class="hero-content">
        <div id="page-title-wrap">
          <p id="page-title">Past Events</p>
          <p id="page-subtitle">Our Journey</p>
        </div>
        <div id="center-box">
          <img id="center-image" src="./background.jpg" alt="center image" />
          <img
            src="./background.png"
            alt="top"
            class="cover-image"
            id="cover-image-top"
          />
          <img
            src="./background.png"
            alt="right"
            class="cover-image"
            id="cover-image-right"
          />
          <img
            src="./background.png"
            alt="bottom"
            class="cover-image"
            id="cover-image-bottom"
          />
          <img
            src="./background.png"
            alt="left"
            class="cover-image"
            id="cover-image-left"
          />
        </div>

        <!-- title block -->
        <div id="gdg-title-wrap">
          <img id="gdg-title-logo" src="./gdgLogo.png" alt="GDG Logo" />
          <div id="gdg-title">
            <div id="gdg-title-text">Google Developer Groups</div>
            <div id="ranchi">रांची</div>
          </div>
        </div>
      </section>
    </div>
    <div class="page" id="page2"></div>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
