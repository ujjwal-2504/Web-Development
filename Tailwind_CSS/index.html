<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailWind Css</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-container flex justify-center mt-8">
      <div class="card border-2 border-black rounded-xl w-1/2">
        <h2
          class="text-center text-3xl font-bold py-10 bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white rounded-t-xl"
        >
          News you can Trust.
        </h2>
        <div class="info flex justify-center flex-col items-center py-4">
          <h3 class="font-bold text-xl">Stay up to date with Latest!</h3>
          <p class="text-lg">
            Subscribe to our newsletter for the latest news straight into your
            inbox
          </p>
          <form action="#" class="w-full flex flex-col items-center">
            <input
              class="text-center w-1/2 py-2 bg-slate-300 rounded mt-4 placeholder:text-md"
              type="text"
              placeholder="you@example.com"
            />
            <button
              class="bg-purple-500 w-1/2 mt-2 py-2 rounded-3xl text-white mb-2"
            >
              Subscribe Now
            </button>
          </form>

          <p>We value your privacy</p>
        </div>
      </div>
    </div>
  </body>
</html>
